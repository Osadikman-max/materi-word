<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kursus Microsoft Word — 24 Pertemuan dari Nol</title>
<meta name="description" content="Materi lengkap Microsoft Word dari nol hingga mahir, terstruktur dalam 24 pertemuan: teori, praktikum, latihan, dan kuis interaktif." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232b579a'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Segoe UI,sans-serif' fill='white' font-weight='bold'>W</text></svg>" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<a class="skip-link" href="#konten">Lompat ke materi</a>

<header class="topbar">
  <button class="icon-btn only-mobile" id="btn-menu" aria-label="Buka menu" aria-expanded="false">
    <span class="burger"></span>
  </button>

  <a class="brand" href="#/">
    <span class="brand-logo">W</span>
    <span class="brand-text">
      <strong>Kursus Microsoft Word</strong>
      <small>24 Pertemuan • Dari Nol hingga Mahir</small>
    </span>
  </a>

  <div class="topbar-tools">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="search" id="search" placeholder="Cari materi, fitur, atau kata kunci…" aria-label="Cari materi" />
      <button class="clear-btn" id="btn-clear-search" hidden aria-label="Bersihkan pencarian">×</button>
    </div>
    <button class="icon-btn" id="btn-theme" title="Ganti tema terang/gelap" aria-label="Ganti tema">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="btn-print" title="Cetak / simpan sebagai PDF" aria-label="Cetak">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M8 17h8v4H8z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="side-progress" id="side-progress"></nav>
    <div class="side-scroll">
      <div id="nav-tree"></div>
    </div>
    <div class="side-foot">
      <span id="foot-stat">Memuat…</span>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="content" id="konten" tabindex="-1">
    <article id="view" class="view">
      <div class="loading">Memuat materi…</div>
    </article>
  </main>
</div>

<button class="to-top" id="to-top" title="Kembali ke atas" aria-label="Kembali ke atas">↑</button>

<script src="assets/js/data-01.js"></script>
<script src="assets/js/data-02.js"></script>
<script src="assets/js/data-03.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
